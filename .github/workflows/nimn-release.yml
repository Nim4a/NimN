name: NimN Windows release

on:
  push:
    tags:
      - 'v*-nimn.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nimn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release --results-directory ./TestResults -- --report-trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: v2rayN/v2rayN.csproj
            package: NimN-windows-64
          - project: v2rayN.Desktop/v2rayN.Desktop.csproj
            package: NimN-windows-64-desktop
    env:
      PROJECT: ${{ matrix.project }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish app and updater
        shell: pwsh
        run: |
          $version = '7.25.1-nimn.1'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          $output = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE
          dotnet publish "v2rayN/$env:PROJECT" -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true "-p:Version=$version" -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish v2rayN/AmazTool/AmazTool.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishTrimmed=true "-p:Version=$version" -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$output/NimN.exe")) { throw 'Missing NimN.exe' }
          if ((Get-Item "$output/NimN.exe").VersionInfo.ProductName -ne 'NimN') { throw 'Incorrect product identity' }
      - name: Bundle cores and regional data
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o core-bin.zip 'https://github.com/2dust/v2rayN-core-bin/raw/574cacd03e03411b49ca8a4fb46bdb4e4253d394/v2rayN-windows-64.zip'
          7z x -y core-bin.zip -ocore-base
          cp -an core-base/v2rayN-windows-64/. "$PACKAGE/"
          curl -fL --retry 3 -o xray.zip 'https://github.com/patterniha/Xray-core/releases/download/v26.9.13/Xray-windows-64.zip'
          7z x -y xray.zip -ocore-xray
          mkdir -p "$PACKAGE/bin/xray" "$PACKAGE/bin/srss"
          cp -f core-xray/xray* "$PACKAGE/bin/xray/"
          for name in geosite geoip; do
            curl -fL --retry 3 -o "$PACKAGE/bin/$name.dat" "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/download/202609160928/$name.dat"
          done
          curl -fL --retry 3 -o "$PACKAGE/bin/srss/geosite-category-ir.srs" 'https://raw.githubusercontent.com/chocolate4u/Iran-sing-box-rules/rule-set/geosite-category-ir.srs'
          curl -fL --retry 3 -o "$PACKAGE/bin/srss/geoip-ir.srs" 'https://raw.githubusercontent.com/chocolate4u/Iran-sing-box-rules/rule-set/geoip-ir.srs'
          test -s "$PACKAGE/bin/xray/xray.exe"
          test -s "$PACKAGE/NimN.exe"
          cp LICENSE "$PACKAGE/LICENSE.txt"
          cp README.md "$PACKAGE/README.md"
      - name: Package and checksum
        shell: pwsh
        run: |
          Get-ChildItem $env:PACKAGE -Recurse -Filter *.pdb | Remove-Item
          7z a -tzip "$env:PACKAGE.zip" $env:PACKAGE -mx5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "$env:PACKAGE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:PACKAGE.zip" | Set-Content "$env:PACKAGE.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.zip
            ${{ matrix.package }}.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: NimN-windows-64*
          path: dist
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "NimN $RELEASE_TAG" --notes 'Personal PattN fork: NI application and status icons, NimN branding, bundled country flag images beside profile names. Country flags update automatically from public server IP lookup over HTTPS (ipwho.is); measured exit-country results take precedence. Only public IPs are submitted, never credentials. Server location can differ from exit location; unknown locations are not guessed. Windows x64 WPF and Avalonia portable packages. Unsigned binaries; SHA-256 checksums included. Unit tests and both UI builds must pass before upload. Device-side connection testing is still required.'
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256
          gh release edit "$RELEASE_TAG" --draft=false
